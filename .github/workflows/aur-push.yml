name: Publish to AUR

# Triggers:
#   • Pushing a version tag (v1.2.3) → fully automatic
#   • workflow_dispatch → manual release of any version
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version without the "v" prefix (e.g. 0.2.0)'
        required: true

jobs:
  aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 1. Resolve the version string regardless of trigger type
      # -----------------------------------------------------------------------
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Strip leading "v" from the git tag
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # 2. Download the release tarball and compute its SHA-256
      # -----------------------------------------------------------------------
      - name: Compute source checksum
        id: sha
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v${VERSION}.tar.gz"
          wget -q -O source.tar.gz "$URL"
          echo "value=$(sha256sum source.tar.gz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 3. Stamp the PKGBUILD with the new version + checksum
      # -----------------------------------------------------------------------
      - name: Update PKGBUILD
        run: |
          VERSION="${{ steps.ver.outputs.value }}"
          SHA256="${{ steps.sha.outputs.value }}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${SHA256}')/" PKGBUILD
          echo "--- updated PKGBUILD ---"
          grep -E "^(pkgver|pkgrel|sha256)" PKGBUILD

      # -----------------------------------------------------------------------
      # 4. Push to AUR
      #
      # Required secrets:
      #   AUR_SSH_PRIVATE_KEY – private key whose public half is registered on
      #                         your AUR account (Settings → SSH Keys)
      #   AUR_USERNAME        – your AUR username (used for the git commit)
      #   AUR_EMAIL           – email used for the git commit
      # -----------------------------------------------------------------------
      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v3.0.1
        with:
          pkgname: yuri-cli
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.ver.outputs.value }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
          # Automatically generates .SRCINFO and force-pushes if needed
          force_push: false
          allow_empty_commits: false
